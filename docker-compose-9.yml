# ─────────────────────────────────────────────────────────────────────────────
# Per-instance nginx configs (each routes to its own frontend service name)
# ─────────────────────────────────────────────────────────────────────────────
configs:
  nginx_conf_w1:
    content: |
      events {}
      http {
        server {
          listen 80;
          location / {
            proxy_pass http://frontend-w1:4000;
            proxy_set_header Host frontend-w1;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
          }
        }
      }
