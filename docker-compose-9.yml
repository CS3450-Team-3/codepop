services:

  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY — Single entry point on port 4000
  # Connects to the bootstrap node (backend-w1) by default.
  # Users can switch servers via the in-app server switcher (Sidebar menu).
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-gateway:
    build:
      context: ./codepop_frontend
    ports:
      - "4000:4000"
    environment:
      BACKEND_URL: "http://backend-w1:9000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./codepop_frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend-w1:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════════════════
  # US-WEST — Instance 1: CodePop Portland 1  (Bootstrap Node)
  # Backend :9001  Machine :9051  Frontend :4001  Nginx :91
  # ═══════════════════════════════════════════════════════════════════════════
  db_w1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data_w1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d codepop_db -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  machine-w1:
    build:
      context: .
      dockerfile: codepop_backend/Dockerfile
    entrypoint: ["python", "pseudo_machine_server.py", "--port", "9050", "--test-mode"]
    ports:
      - "9051:9050"
    volumes:
      - ./codepop_backend:/app

  backend-w1:
    build:
      context: .
      dockerfile: codepop_backend/Dockerfile
    ports:
      - "9001:9000"
    environment:
      DB_HOST: db_w1
      DB_NAME: codepop_db
      DB_USER: postgres
      DB_PASSWORD: password
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-TODO_get_a_new_secret_stripe_key}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-pk_test_51T5DqLPnaMtT5PTkugtHqM5ew5RSzkCJ0jklGkdSRXw8VnaiIN3AEW5NAYJzmdrYz2cUjQ7i9uvr9N2hpQnj01gE00jCYApVMN}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-TODO_get_a_webhook_secret}"
      SERVER_URL: "http://backend-w1:9000"
      MACHINE_HOST: "machine-w1"
      MACHINE_PORT: "9050"
      SETUP_ADMIN_USERNAME: "admin"
      SETUP_ADMIN_PASSWORD: "password123"
      SETUP_ADMIN_EMAIL: "test@email.com"
      SETUP_ADMIN_FIRST_NAME: "Test"
      SETUP_ADMIN_LAST_NAME: "Ing"
      SETUP_REGION_NAME: "us-west"
      STORE_NAME: "CodePop Portland 1"
      STORE_ADDRESS: "100 SW Main St"
      STORE_CITY: "Portland"
      STORE_STATE: "OR"
      STORE_ZIP: "97201"
      STORE_GEOHASH: "c20g7c"
    volumes:
      - ./codepop_backend:/app
      - node_data_w1:/data
    depends_on:
      db_w1:
        condition: service_healthy
      machine-w1:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend-w1:
    build:
      context: ./codepop_frontend
    ports:
      - "4001:4000"
    environment:
      BACKEND_URL: "http://backend-w1:9000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./codepop_frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend-w1:
        condition: service_started

  nginx_w1:
    image: nginx:alpine
    ports:
      - "91:80"
    configs:
      - source: nginx_conf_w1
        target: /etc/nginx/nginx.conf
    depends_on:
      - frontend-w1

