services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d codepop_db -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: codepop_backend/Dockerfile
    ports:
      - "9000:9000"
    environment:
      DB_HOST: db
      DB_NAME: codepop_db
      DB_USER: postgres
      DB_PASSWORD: password
      SERVER_URL: "http://backend:9000"
      SETUP_ADMIN_USERNAME: "admin1234"
      SETUP_ADMIN_PASSWORD: "77177717"
      SETUP_ADMIN_EMAIL: "test@email.com"
      SETUP_ADMIN_FIRST_NAME: "Dillan"
      SETUP_ADMIN_LAST_NAME: "Hart"
      SETUP_REGION_NAME: "us-west"
      STORE_NAME: "town crossing"
      STORE_ADDRESS: "1234 town crossing"
      STORE_CITY: "Logan"
      STORE_STATE: "UT"
      STORE_ZIP: "84341"
    volumes:
      - node_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./codepop_frontend
    ports:
      - "4000:4000"
    environment:
      BACKEND_URL: "http://backend:9000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "90:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
  node_data:
