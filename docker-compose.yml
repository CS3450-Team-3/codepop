services:
  db1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepop_db1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codepop_db2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend1:
    build:
      context: .
      dockerfile: codepop_backend/Dockerfile
    ports:
      - "9001:9000"
    environment:
      DB_HOST: db1
      DB_NAME: codepop_db1
      DB_USER: postgres
      DB_PASSWORD: password
      LOCAL_SERVER_ID: "1"
      SERVER_URL: "http://backend1:9000"
      PEER_SERVER_URL: "http://backend2:9000"
      SYNC_INTERVAL_SECONDS: "120"
      RUN_DEV_SEED: "true"
    depends_on:
      db1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/backend/p2p/discover/')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend2:
    build:
      context: .
      dockerfile: codepop_backend/Dockerfile
    ports:
      - "9002:9000"
    environment:
      DB_HOST: db2
      DB_NAME: codepop_db2
      DB_USER: postgres
      DB_PASSWORD: password
      LOCAL_SERVER_ID: "2"
      SERVER_URL: "http://backend2:9000"
      PEER_SERVER_URL: "http://backend1:9000"
      SYNC_INTERVAL_SECONDS: "120"
      # Join backend1's region instead of creating a new one
      SETUP_PEER_URL: "http://backend1:9000"
      SETUP_ADMIN_USERNAME: "admin2"
      SETUP_ADMIN_PASSWORD: "changeme123"
    depends_on:
      db2:
        condition: service_healthy
      backend1:
        condition: service_healthy

  frontend:
    build:
      context: ./codepop_frontend
    ports:
      - "4000:4000"
    environment:
      BACKEND1_URL: "http://backend1:9000"
      BACKEND2_URL: "http://backend2:9000"
    depends_on:
      - backend1
      - backend2

  nginx:
    image: nginx:alpine
    ports:
      - "100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend

volumes:
  postgres_data1:
  postgres_data2:
