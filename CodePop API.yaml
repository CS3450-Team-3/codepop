openapi: 3.0.3
info:
  title: CodePop API
  version: 1.0.0
  description: Comprehensive API for CodePop beverage management and P2P networking.
paths:
  /backend/auth/login/:
    post:
      operationId: backend_auth_login_create
      description: Login with username and password to receive JWT access and refresh
        tokens. Supports inter-server proxying if the user's home server is elsewhere.
        The refresh token is also set as an HttpOnly cookie.
      tags:
      - backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /backend/auth/logout/:
    post:
      operationId: backend_auth_logout_create
      description: Logout the user by blacklisting the refresh token. If the token
        belongs to a remote Home Server, the request is proxied there. Also clears
        the 'refresh_token' HttpOnly cookie.
      tags:
      - backend
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /backend/auth/refresh/:
    post:
      operationId: backend_auth_refresh_create
      description: Refresh an access token. If the refresh token was issued by a remote
        Home Server, the request is proxied to that server for authoritative validation.
        Supports reading from the 'refresh_token' HttpOnly cookie.
      tags:
      - backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
