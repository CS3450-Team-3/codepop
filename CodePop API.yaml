components:
  schemas:
    ChatbotRequest:
      type: object
      properties:
        message:
          type: string
          description: User message to the chatbot
        wrong_drink_phase:
          type: string
        refund_phase:
          type: string
        order_num:
          type: string
        drink_nums:
          type: string
      required:
      - message
    ChatbotResponse:
      type: object
      properties:
        responses:
          description: Chatbot responses
        wrong_drink_phase:
          type: string
        refund_phase:
          type: string
        order_num:
          type: string
        drink_nums:
          type: string
      required:
      - drink_nums
      - order_num
      - refund_phase
      - responses
      - wrong_drink_phase
    CreateUser:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
      required:
      - password
      - username
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Drink:
      type: object
      properties:
        DrinkID:
          type: string
          format: uuid
          readOnly: true
        Name:
          type: string
          maxLength: 255
        SyrupsUsed:
          type: array
          items:
            type: string
            maxLength: 255
          nullable: true
        SodaUsed:
          type: array
          items:
            type: string
            maxLength: 255
        AddIns:
          type: array
          items:
            type: string
            maxLength: 255
          nullable: true
        Rating:
          type: number
          format: double
          nullable: true
        Price:
          type: number
          format: double
        Size:
          type: string
          maxLength: 10
        Ice:
          type: string
          maxLength: 10
        User_Created:
          type: boolean
        Favorite:
          type: array
          items:
            type: string
            format: uuid
      required:
      - DrinkID
      - Name
      - Price
      - SodaUsed
      - User_Created
    EmailAPIResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    GetUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
      required:
      - id
      - is_staff
      - is_superuser
      - password
      - username
    Inventory:
      type: object
      properties:
        InventoryID:
          type: integer
          readOnly: true
        ItemName:
          type: string
          maxLength: 100
        ItemType:
          $ref: '#/components/schemas/ItemTypeEnum'
        Quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        ThresholdLevel:
          type: integer
          maximum: 2147483647
          minimum: 0
        LastUpdated:
          type: string
          format: date-time
          readOnly: true
      required:
      - InventoryID
      - ItemName
      - ItemType
      - LastUpdated
      - Quantity
      - ThresholdLevel
    InventoryReportItem:
      type: object
      properties:
        InventoryID:
          type: integer
        ItemName:
          type: string
        Quantity:
          type: integer
        ThresholdLevel:
          type: integer
      required:
      - InventoryID
      - ItemName
      - Quantity
      - ThresholdLevel
    InventoryReportResponse:
      type: object
      properties:
        inventory_items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryReportItem'
        total_items:
          type: integer
        out_of_stock:
          type: integer
        below_threshold:
          type: integer
      required:
      - below_threshold
      - inventory_items
      - out_of_stock
      - total_items
    ItemTypeEnum:
      enum:
      - Soda
      - Syrup
      - Add In
      - Physical
      type: string
      description: |-
        * `Soda` - Soda
        * `Syrup` - Syrup
        * `Add In` - Add In
        * `Physical` - Physical
    MasterListSyncItem:
      type: object
      properties:
        UserID:
          type: string
        Username:
          type: string
        HomeServerID:
          type: string
      required:
      - HomeServerID
      - UserID
      - Username
    MasterListSyncRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MasterListSyncItem'
      required:
      - items
    MasterListSyncResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Notification:
      type: object
      properties:
        NotificationID:
          type: integer
          readOnly: true
        Message:
          type: string
          maxLength: 500
        Timestamp:
          type: string
          format: date-time
        Type:
          type: string
          maxLength: 50
        Global:
          type: boolean
        UserID:
          type: string
          format: uuid
      required:
      - Message
      - NotificationID
      - Type
      - UserID
    Order:
      type: object
      properties:
        OrderID:
          type: string
          format: uuid
          readOnly: true
        UserID:
          type: string
          format: uuid
          nullable: true
        OriginatingServer:
          type: string
          nullable: true
        Drinks:
          type: array
          items:
            type: string
            format: uuid
        OrderStatus:
          $ref: '#/components/schemas/OrderStatusEnum'
        PaymentStatus:
          $ref: '#/components/schemas/PaymentStatusEnum'
        PickupTime:
          type: string
          format: date-time
          nullable: true
        CreationTime:
          type: string
          format: date-time
          readOnly: true
        LockerCombo:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        StripeID:
          type: string
          nullable: true
          maxLength: 255
        Synced:
          type: boolean
      required:
      - CreationTime
      - Drinks
      - OrderID
    OrderStatusEnum:
      enum:
      - Pending
      - Processing
      - Completed
      - Cancelled
      type: string
      description: |-
        * `Pending` - Pending
        * `Processing` - Processing
        * `Completed` - Completed
        * `Cancelled` - Cancelled
    PatchedInventory:
      type: object
      properties:
        InventoryID:
          type: integer
          readOnly: true
        ItemName:
          type: string
          maxLength: 100
        ItemType:
          $ref: '#/components/schemas/ItemTypeEnum'
        Quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        ThresholdLevel:
          type: integer
          maximum: 2147483647
          minimum: 0
        LastUpdated:
          type: string
          format: date-time
          readOnly: true
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
    PaymentStatusEnum:
      enum:
      - Pending
      - Paid
      - Failed
      - Remade
      type: string
      description: |-
        * `Pending` - Pending
        * `Paid` - Paid
        * `Failed` - Failed
        * `Remade` - Remade
    Preference:
      type: object
      properties:
        PreferenceID:
          type: integer
          readOnly: true
        UserID:
          type: string
          format: uuid
        Preference:
          type: string
          maxLength: 100
      required:
      - Preference
      - PreferenceID
      - UserID
    Revenue:
      type: object
      properties:
        RevenueID:
          type: string
          format: uuid
          readOnly: true
        OrderID:
          type: string
          format: uuid
        TotalAmount:
          type: number
          format: double
          nullable: true
        SaleDate:
          type: string
          format: date-time
        Refunded:
          type: boolean
      required:
      - OrderID
      - RevenueID
    ServerRegistry:
      type: object
      properties:
        ServerID:
          type: string
          maxLength: 100
        ServerURL:
          type: string
          format: uri
          maxLength: 255
        PublicKey:
          type: string
        Status:
          type: string
          maxLength: 20
        LastSeen:
          type: string
          format: date-time
          readOnly: true
        Region:
          type: integer
          nullable: true
        IsRegionLeader:
          type: boolean
      required:
      - LastSeen
      - PublicKey
      - ServerID
      - ServerURL
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
      required:
      - id
      - username
    UserTypeEnum:
      enum:
      - customer
      - store_manager
      - logistics_manager
      - repair_staff
      - admin
      - super_admin
      type: string
      description: |-
        * `customer` - Customer
        * `store_manager` - Store Manager
        * `logistics_manager` - Logistics Manager
        * `repair_staff` - Repair Staff
        * `admin` - Admin
        * `super_admin` - Super Admin
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
